services:
  back:
    build: ./back
    ports:
      - "8000:8000"

  client:
    build:
      context: ./client
      args:
        # The browser calls the API directly, so this is the host-facing URL, not http://back:8000.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - back
